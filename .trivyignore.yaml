vulnerabilities:
  - id: GHSA-6v7p-g79w-8964
    purls:
      - pkg:pypi/msgpack@1.1.2
    statement: >-
      The official Python image's third-party SBOM includes build-time
      msgpack metadata. The final runtime image contains neither standalone
      msgpack nor pip's vendored copy after pip is uninstalled. Verify with
      importlib.metadata and a filesystem check; pip list is unavailable.
    expired_at: 2026-11-30
  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    statement: >-
      The official Python image's third-party SBOM includes build-time
      setuptools metadata. The final runtime image contains neither
      setuptools nor pip's vendored pkg_resources after pip is uninstalled.
      Verify with importlib.metadata and a filesystem check.
    expired_at: 2026-11-30
